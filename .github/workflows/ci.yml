name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.1
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run check && bun run check:types
  unit:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.1
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run test
  browser:
    name: Playwright
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.21.0
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
    - run: bun install --frozen-lockfile
    - run: bunx playwright install --with-deps chromium
    - run: bun run test:e2e
    - uses: actions/upload-artifact@v7.0.1
      if: ${{ failure() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore
    - name: Reject tracked-file mutation
      run: git diff --exit-code HEAD
    timeout-minutes: 30
    env:
      CI: 'true'
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: j178/prek-action@v3.0.0
      with:
        # renovate: datasource=github-releases depName=j178/prek
        prek-version: 0.5.3
        extra-args: --all-files --hook-stage manual
      env:
        SKIP: no-commit-to-branch,biome-check,svelte-check
    - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs:
    - quality
    - unit
    - browser
    - hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
    - uses: edbfi/automation/actions/gate@v4.1.1
      with:
        needs: ${{ toJSON(needs) }}
        required: quality unit browser hygiene
